---
- name: 检查是否已生成 MariaDB 连接凭证
  ansible.builtin.stat:
    path: ~/.config/homelab/mariadb_config.yml
  register: mariadb_config_file
  delegate_to: localhost
  run_once: true

- name: 拦截并提示 (无痕退出)
  when: not mariadb_config_file.stat.exists
  run_once: true
  block:
    - name: 打印拦截提示
      ansible.builtin.debug:
        msg: |
          
          ======================================================================
           🚨 架构解耦拦截：未找到 MariaDB 部署凭证！
          ======================================================================
           系统检测到 ~/.config/homelab/mariadb_config.yml 不存在。
           
           由于两个项目现已彻底解耦，TV 项目不再包含硬编码的数据库密码。
           它需要依赖 QNAP 基础设施端主动生成的“连接钥匙”才能继续。
           
           👉 【一键修复方案】:
           请在终端前往 QNAP 项目目录，执行一次部署以生成该凭证：
           
           $ cd ~/Coding/Ansible_QNAP/ansible
           $ ansible-playbook site.yml --tags mariadb
           
          ======================================================================
    
    - name: 优雅中断当前 Playbook
      ansible.builtin.meta: end_play

- name: 加载 MariaDB 连接凭证
  ansible.builtin.include_vars:
    file: ~/.config/homelab/mariadb_config.yml

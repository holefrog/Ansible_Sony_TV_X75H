---
- name: 检查是否已生成 MariaDB 连接凭证
  ansible.builtin.stat:
    path: ~/.config/homelab/mariadb_config.yml
  register: mariadb_config_file
  delegate_to: localhost
  run_once: true

- name: 确认凭证文件存在
  ansible.builtin.fail:
    msg: "未找到 MariaDB 部署凭证 (~/.config/homelab/mariadb_config.yml)。请先运行 QNAP 部署脚本。"
  when: not mariadb_config_file.stat.exists
  run_once: true

- name: 加载 MariaDB 连接凭证
  ansible.builtin.include_vars:
    file: ~/.config/homelab/mariadb_config.yml

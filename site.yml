---
- name: 通过 ADB 自动化配置 Sony Bravia X75H
  hosts: localhost
  connection: local
  gather_facts: false
  # 所有变量统一在 group_vars/all.yml 中定义
  pre_tasks:
    - name: 载入外部数据库配置
      ansible.builtin.import_tasks: tools/load_db_secrets.yml

    - name: 部署前检查清单
      ansible.builtin.pause:
        prompt: |
          ====================================================
          部署前检查清单：
          1. Sony TV 已开机且屏幕已唤醒（息屏会断开 ADB）
          2. TV 与控制节点在同一网段（{{ tv_ip }}）
          3. 所有 APK 已放入 roles/apps/files/
          4. 确保 NFS 设置正确，权限参数已配置完毕
          按 Enter 继续，Ctrl+C 取消
          ====================================================



    - name: 验证 MariaDB 连通性 (检查 3306 端口)
      ansible.builtin.wait_for:
        host: "{{ mariadb_host }}"
        port: "{{ mariadb_port }}"
        timeout: 3
        state: started
      register: db_info
      failed_when: false

    - name: 确认 MariaDB 可达
      ansible.builtin.fail:
        msg: |
          【连接失败】无法连接到 MariaDB {{ mariadb_host }}:{{ mariadb_port }}
          在部署前，要先运行 Ansible_QNAP 项目部署 MariaDB。
          请检查：
          1. QNAP 上 kodi-mariadb 容器是否正在运行
          2. 3306 端口是否已对外开放
          3. mariadb_root_password 是否正确
      when: db_info.failed is defined and db_info.failed

  roles:
    - system_init
    - apps

  post_tasks:
    - name: 自动化收尾 - 启动 Kodi 以触发数据库初始化
      ansible.builtin.command: "{{ adb_cmd }} shell am start -n org.xbmc.kodi/.Splash"
      delegate_to: localhost
      changed_when: true

    - name: 等待 15 秒让 Kodi 自动建库完成
      ansible.builtin.pause:
        seconds: 15
        prompt: "正在等待 Kodi 启动并自动在 MariaDB 中建立 MyVideos131 库..."

- name: 自动同步媒体库内容类型
  import_playbook: tools/sync_paths.yml

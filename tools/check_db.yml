---
- name: 独立执行 Kodi 数据库排查
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: 载入外部数据库配置
      ansible.builtin.import_tasks: load_db_secrets.yml

    - name: 确保安装了数据库依赖
      ansible.builtin.import_tasks: ensure_pymysql.yml

    - name: 运行数据库排查报告
      ansible.builtin.import_tasks: check_db_tasks.yml

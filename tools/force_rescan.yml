---
- name: 强制 Kodi 深度重扫媒体库
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: 载入外部数据库配置
      ansible.builtin.import_tasks: ../load_db_secrets.yml

    - name: 确保安装了数据库依赖
      ansible.builtin.import_tasks: ensure_pymysql.yml

    - name: 清除 Kodi 数据库中的目录哈希缓存 (破坏 Fast Hash)
      ansible.mariadb.mariadb_query:
        login_host: "{{ mariadb_host }}"
        login_port: "{{ mariadb_port }}"
        login_user: "{{ mariadb_user }}"
        login_password: "{{ mariadb_user_password }}"
        login_db: "MyVideos131"
        query: "UPDATE path SET strHash = '';"
      changed_when: true

    - name: 彻底关闭 Kodi 进程 (清除运行缓存)
      ansible.builtin.command: >
        {{ adb_cmd }} shell am force-stop org.xbmc.kodi
      changed_when: true

    - name: 全新启动 Kodi
      ansible.builtin.command: >
        {{ adb_cmd }} shell monkey -p org.xbmc.kodi -c android.intent.category.LAUNCHER 1
      changed_when: true
---
- name: 重置 Kodi 数据库 (删除损坏的空壳库)
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml

  tasks:
    - name: 确保安装了数据库依赖
      ansible.builtin.import_tasks: ensure_pymysql.yml

    - name: 删除 MyVideos131 数据库
      ansible.mariadb.mariadb_db:
        login_host: "{{ mariadb_host }}"
        login_port: "{{ mariadb_port }}"
        login_user: root
        login_password: "{{ mariadb_root_password }}"
        name: MyVideos131
        state: absent
